    <meta name="description" content="Du Lịch Số Việt Nam - Hệ thống điều hành tour dành cho doanh nghiệp lữ hành và cổng đặt dịch vụ du lịch trực tuyến." />
    <meta property="og:title" content="Du Lịch Số Việt Nam - Hệ Thống Điều Hành &amp; Đặt Dịch Vụ Du Lịch Trực Tuyến" />
    <meta property="og:description" content="Du Lịch Số Việt Nam - Hệ thống điều hành tour dành cho doanh nghiệp lữ hành và cổng đặt dịch vụ du lịch trực tuyến." />

    <script>
      (function() {
        var theme = localStorage.getItem('dulichso-theme');
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
